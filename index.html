<!doctype html>
<html lang="id">
<head>
  <meta name="6a97888e-site-verification" content="bf5503829d6fa2359609d79d67892233">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>videypro</title>

  <!-- favicon pake logo -->
  <link rel="icon" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh6s1XWqZEsV1lM6IpO7DtDtvK_FrWPhd40Bl858JxP5qFVvh2TPNyCNuShcMQWOsuV0WHv7S14C2WYPumF6WZOgc2D59hRAdnMIeGuSKKxZtlyujnakGnVLREf9Lwm8G2I0IYKXUY4aYtJ88qWJVXDw-ffYtvoPjtQxqYmEZqY0VL9IafS0a7mw6jke6wE/s1154/104427.png" />

  <style>
    :root{
      --bg:#0a0a0a;
      --card:#111;
      --line:#1f1f1f;
      --muted:#9ca3af;
      --text:#fff;
      --acc:#60a5fa;
      --r:16px;
      --max:1080px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}

    /* Header (kecil) */
    .header{
      position:sticky; top:0; z-index:50;
      background:rgba(10,10,10,.85);
      backdrop-filter:saturate(140%) blur(10px);
      border-bottom:1px solid var(--line);
    }
    .bar{
      max-width:var(--max); margin:0 auto;
      padding:10px 12px;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .left{
      display:flex; align-items:center; gap:10px; min-width:0;
    }
    .logo{
      width:28px; height:28px; border-radius:8px;
      background:#000; border:1px solid var(--line);
      overflow:hidden; flex:0 0 auto;
    }
    .logo img{width:100%;height:100%;object-fit:cover}
    .brand{
      font-weight:800; letter-spacing:.2px;
      font-size:16px; line-height:1;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }

    .right{display:flex; align-items:center; gap:8px}
    .iconbtn{
      width:38px; height:38px;
      border-radius:12px;
      background:#0d0d0d; border:1px solid var(--line);
      display:grid; place-items:center;
      cursor:pointer;
    }
    .iconbtn:hover{border-color:#2b2b2b}
    .iconbtn svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}

    /* Search dropdown (toggle) */
    .searchWrap{
      max-width:var(--max); margin:0 auto;
      padding:0 12px 10px;
      display:none;
    }
    .searchWrap.on{display:block}
    .searchBox{
      display:flex; gap:10px; align-items:center;
      background:#0d0d0d; border:1px solid var(--line);
      border-radius:14px; padding:10px 12px;
    }
    .searchBox input{
      flex:1; border:0; outline:0;
      background:transparent; color:#fff;
      font-size:14px;
    }
    .searchHint{color:var(--muted); font-size:12px}

    /* Drawer */
    .drawerMask{
      position:fixed; inset:0; z-index:60;
      background:rgba(0,0,0,.55);
      display:none;
    }
    .drawerMask.on{display:block}
    .drawer{
      position:fixed; top:0; right:-320px; height:100%; width:320px; z-index:61;
      background:#0d0d0d; border-left:1px solid var(--line);
      transition:right .2s ease;
      padding:14px;
    }
    .drawer.on{right:0}
    .drawerTop{display:flex; align-items:center; justify-content:space-between; gap:10px}
    .drawerTitle{font-weight:800}
    .closebtn{
      width:38px;height:38px;border-radius:12px;
      background:#0b0b0b;border:1px solid var(--line);
      display:grid;place-items:center;cursor:pointer;
    }
    .navList{margin-top:12px; display:flex; flex-direction:column; gap:8px}
    .navItem{
      padding:10px 12px;
      border-radius:12px;
      background:#0b0b0b;
      border:1px solid var(--line);
      cursor:pointer;
      font-size:14px;
    }
    .navItem:hover{border-color:#2b2b2b}
    .navSection{margin-top:10px; color:var(--muted); font-size:12px}

    /* Layout */
    .wrap{max-width:var(--max); margin:0 auto; padding:14px 12px 0}
    .sectionTitle{
      display:flex; align-items:center; justify-content:space-between;
      margin:10px 0 10px;
      gap:10px;
    }
    .sectionTitle h2{
      margin:0; font-size:14px; letter-spacing:.2px;
      color:#e5e7eb; font-weight:800;
    }

    /* Carousel (popular + poster tiktok) */
    .carousel{
      position:relative;
      background:transparent;
    }
    .track{
      display:flex; gap:10px;
      overflow:auto; scroll-snap-type:x mandatory;
      padding-bottom:6px;
      -webkit-overflow-scrolling:touch;
    }
    .track::-webkit-scrollbar{height:8px}
    .track::-webkit-scrollbar-thumb{background:#1a1a1a;border-radius:999px}
    .citem{
      flex:0 0 auto;
      width:220px; /* kecilin popular + umum */
      scroll-snap-align:start;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--r);
      overflow:hidden;
    }

    /* FIX: poster tiktok lebih kecil lagi */
    .citem.tiktok{ width:120px; }

    .thumb169{aspect-ratio:16/9;background:#000;height:auto}
    /* thumb196 dipakai poster tiktok 9:16 */
    .thumb196{aspect-ratio:9/16;background:#000;height:auto}
    .thumb196 img{width:100%;height:100%;object-fit:cover}

    .citem img{width:100%;height:100%;object-fit:cover}
    .cmeta{padding:10px 10px 12px}
    .ctitle{
      font-weight:800; font-size:13px; line-height:1.2;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .csub{margin-top:6px; font-size:12px; color:var(--muted)}
    .carBtns{
      position:absolute; inset:0; pointer-events:none;
      display:flex; align-items:center; justify-content:space-between;
    }
    .carBtn{
      pointer-events:auto;
      width:36px;height:36px;border-radius:12px;
      border:1px solid var(--line);
      background:rgba(13,13,13,.8);
      display:grid;place-items:center; cursor:pointer;
      margin:0 6px;
    }
    .carBtn svg{width:18px;height:18px;stroke:#fff;stroke-width:2;fill:none;opacity:.9}
    .carBtn:hover{border-color:#2b2b2b}

    /* Grid videos 2 kolom (JANGAN jadi 1 kolom) */
    .grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:12px;
      margin-top:10px;
    }
    @media (min-width:900px){
      .grid{grid-template-columns:repeat(3, minmax(0, 1fr))}
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--r);
      overflow:hidden;
    }
    .card .thumb{aspect-ratio:16/9;background:#000}
    .card .thumb img{width:100%;height:100%;object-fit:cover}
    .meta{padding:10px 10px 12px}
    .title{
      font-weight:800;font-size:13px;line-height:1.2;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .sub{margin-top:6px;font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}

    /* Badges */
    .thumb, .thumb169, .thumb196{position:relative; overflow:hidden}
    .badgeHD{
      position:absolute; top:8px; left:8px;
      padding:4px 8px; border-radius:999px;
      font-size:12px; font-weight:800;
      background:rgba(0,0,0,.65);
      border:1px solid rgba(255,255,255,.12);
    }
    .badgeViews{
      position:absolute; bottom:8px; right:8px;
      padding:4px 8px; border-radius:999px;
      font-size:12px; font-weight:700;
      background:rgba(0,0,0,.65);
      border:1px solid rgba(255,255,255,.12);
      color:#e5e7eb;
    }

    /* Pagination */
    .pager{
      display:flex; gap:8px; flex-wrap:wrap;
      justify-content:center;
      padding:16px 0 6px;
    }
    .pbtn{
      min-width:38px;height:38px;
      border-radius:12px;
      background:#0d0d0d;
      border:1px solid var(--line);
      display:grid;place-items:center;
      cursor:pointer;
      font-size:13px;
      padding:0 10px;
      color:#fff;
    }
    .pbtn:hover{border-color:#2b2b2b}
    .pbtn.on{background:#0b1220;border-color:#2b3a57;color:#fff}
    .pbtn.dot{cursor:default; opacity:.7}

    /* Footer */
    .footer{
      border-top:1px solid var(--line);
      margin-top:14px;
      padding:14px 12px 18px;
      color:var(--muted);
      font-size:12px;
      text-align:center;
    }

    /* Utility */
    .hide{display:none!important}
  </style>
</head>

<body>
  <!-- Header -->
  <header class="header">
    <div class="bar">
      <div class="left">
        <div class="logo">
          <img alt="logo" loading="lazy"
               src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh6s1XWqZEsV1lM6IpO7DtDtvK_FrWPhd40Bl858JxP5qFVvh2TPNyCNuShcMQWOsuV0WHv7S14C2WYPumF6WZOgc2D59hRAdnMIeGuSKKxZtlyujnakGnVLREf9Lwm8G2I0IYKXUY4aYtJ88qWJVXDw-ffYtvoPjtQxqYmEZqY0VL9IafS0a7mw6jke6wE/s1154/104427.png" />
        </div>
        <div class="brand">videypro</div>
      </div>

      <div class="right">
        <button class="iconbtn" id="btnSearch" aria-label="search">
          <svg viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3"/><circle cx="11" cy="11" r="7"/></svg>
        </button>
        <button class="iconbtn" id="btnMenu" aria-label="menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>

      </div>
    </div>

    <!-- Search (toggle) -->
    <div class="searchWrap" id="searchWrap">
      <div class="searchBox">
        <input id="q" placeholder="Cari judul / genre..." autocomplete="off" />
        <div class="searchHint" id="searchHint"></div>
      </div>
    </div>
  </header>

  <!-- Drawer -->
  <div class="drawerMask" id="drawerMask"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawerTop">
      <div class="drawerTitle">Menu</div>
      <button class="closebtn" id="btnClose" aria-label="close">
        <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>

    <div class="navList" id="navStatic">
      <div class="navItem" data-nav="latest">Latest Update</div>
      <div class="navItem" data-nav="new">New Update</div>
      <div class="navItem" data-nav="jadwal">Jadwal Update</div>
    </div>

    <div class="navSection">Genre</div>
    <div class="navList" id="navGenres"></div>
  </aside>

  <!-- Content -->
  <main class="wrap">

    <!-- Popular -->
    <section id="popularSection" class="hide">
      <div class="sectionTitle">
        <h2>Popular Post</h2>
      </div>
      <div class="carousel">
        <div class="track" id="popularTrack"></div>
        <div class="carBtns">
          <button class="carBtn" id="popularPrev" aria-label="prev">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button class="carBtn" id="popularNext" aria-label="next">
            <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- Poster (tiktok 9:16) - cuma di bawah popular -->
    <section id="wideSection" class="hide" style="margin-top:14px">
      <div class="sectionTitle">
        <h2>Poster</h2>
        <button id="seeAllPoster" class="pbtn" type="button">See All</button>
      </div>
      <div class="carousel">
        <div class="track" id="wideTrack"></div>
        <div class="carBtns">
          <button class="carBtn" id="widePrev" aria-label="prev">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button class="carBtn" id="wideNext" aria-label="next">
            <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- Grid -->
    <section style="margin-top:14px">
      <div class="sectionTitle">
        <h2 id="listTitle">All Videos</h2>
      </div>
      <div class="grid" id="grid"></div>
      <div class="pager" id="pager"></div>
    </section>

    <footer class="footer">videypro</footer>
  </main>

  <script>
    // ---------- Utils ----------
    const $ = (id) => document.getElementById(id);
    const esc = (s="") => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const debounce = (fn, ms=150) => { let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; };

    // ---------- Config ----------
    const PAGE_SIZE = 20;         // max 20 per halaman (grid 16:9)
    const INSERT_WIDE_EVERY = 6;  // sela 6 video
    const LOGO = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh6s1XWqZEsV1lM6IpO7DtDtvK_FrWPhd40Bl858JxP5qFVvh2TPNyCNuShcMQWOsuV0WHv7S14C2WYPumF6WZOgc2D59hRAdnMIeGuSKKxZtlyujnakGnVLREf9Lwm8G2I0IYKXUY4aYtJ88qWJVXDw-ffYtvoPjtQxqYmEZqY0VL9IafS0a7mw6jke6wE/s1154/104427.png";

    // ---------- State ----------
    let all = [];
    let filtered = [];
    let currentPage = 1;
    let currentGenre = ""; // filter dari drawer
    let showAllPoster = false; // tombol See All poster

    // ---------- API ----------
    async function loadVideos(){
      // bust cache + edge stale
      const url = `/api/videos?t=${Date.now()}`;
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error(await r.text());
      const data = await r.json();
      return Array.isArray(data) ? data : [];
    }

    // ---------- Header controls ----------
    function toggleSearch(force){
      const w = $("searchWrap");
      const on = typeof force === "boolean" ? force : !w.classList.contains("on");
      w.classList.toggle("on", on);
      if (on) {
        $("q").focus();
      } else {
        $("q").value = "";
        $("searchHint").textContent = "";
        currentGenre = "";
        applyFilters();
      }
    }

    function openDrawer(open){
      const mask = $("drawerMask");
      const d = $("drawer");
      const on = typeof open === "boolean" ? open : !d.classList.contains("on");
      mask.classList.toggle("on", on);
      d.classList.toggle("on", on);
      d.setAttribute("aria-hidden", on ? "false" : "true");
    }

    // ---------- Carousels ----------
    function scrollByCard(track, dir=1){
      const card = track.querySelector(".citem");
      const w = card ? (card.getBoundingClientRect().width + 10) : 220;
      track.scrollBy({ left: dir * w * 2, behavior: "smooth" });
    }

    function fmtViews(n){
      const x = Number(n || 0);
      try { return x.toLocaleString("id-ID"); } catch { return String(x); }
    }

    function renderCarousel(trackEl, items, kind){
      // kind: "popular" (16:9) or "wide" (poster tiktok 9:16)
      trackEl.innerHTML = items.map(v => {
        const isTikTok = (kind === "wide");
        const thumb = isTikTok ? (v.poster_wide_url || v.thumbnail_url || LOGO) : (v.thumbnail_url || LOGO);
        const ratioClass = isTikTok ? "thumb196" : "thumb169";
        const viewsText = fmtViews(v.views);
        return `
          <a class="citem ${isTikTok ? "tiktok" : ""}" href="/watch.html?id=${encodeURIComponent(v.id)}" title="${esc(v.title)}">
            <div class="${ratioClass}">
              <img loading="lazy" src="${esc(thumb)}" alt="${esc(v.title)}" />
              <div class="badgeHD">HD</div>
              <div class="badgeViews">${viewsText} views</div>
            </div>
            <div class="cmeta">
              <div class="ctitle">${esc(v.title || "Untitled")}</div>
              <div class="csub">${esc(v.genre || "")}</div>
            </div>
          </a>
        `;
      }).join("");
    }

    // ---------- Grid + Poster insertion ----------
    function buildGridItems(pageItems, posters){
      const chunks = [];
      let pIndex = 0;

      for (let i=0; i<pageItems.length; i++){
        chunks.push({ type:"video", v: pageItems[i] });

        const at = i + 1;
        const shouldInsert = (at % INSERT_WIDE_EVERY === 0);
        if (shouldInsert && posters.length){
          const slice = posters.slice(pIndex, pIndex + 10);
          if (slice.length){
            chunks.push({ type:"wideStrip", posters: slice });
            pIndex += slice.length;
            if (pIndex >= posters.length) pIndex = 0;
          }
        }
      }
      return chunks;
    }

    function renderWideStrip(posters, idx){
      const id = `wstrip_${idx}`;
      const prevId = `wprev_${idx}`;
      const nextId = `wnext_${idx}`;
      return `
        <div class="card" style="grid-column:1/-1;padding:10px">
          <div class="carousel">
            <div class="track" id="${id}">
              ${posters.map(v => {
                const viewsText = fmtViews(v.views);
                return `
                <a class="citem tiktok" href="/watch.html?id=${encodeURIComponent(v.id)}" title="${esc(v.title)}">
                  <div class="thumb196">
                    <img loading="lazy" src="${esc(v.poster_wide_url || v.thumbnail_url || LOGO)}" alt="${esc(v.title)}" />
                    <div class="badgeHD">HD</div>
                    <div class="badgeViews">${viewsText} views</div>
                  </div>
                  <div class="cmeta">
                    <div class="ctitle">${esc(v.title || "Untitled")}</div>
                    <div class="csub">${esc(v.genre || "")}</div>
                  </div>
                </a>
                `;
              }).join("")}
            </div>
            <div class="carBtns">
              <button class="carBtn" id="${prevId}" aria-label="prev">
                <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
              </button>
              <button class="carBtn" id="${nextId}" aria-label="next">
                <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderGrid(chunks){
      const grid = $("grid");
      let stripCount = 0;

      grid.innerHTML = chunks.map(item => {
        if (item.type === "wideStrip"){
          const html = renderWideStrip(item.posters, stripCount);
          stripCount++;
          return html;
        }
        const v = item.v;
        const thumb = v.thumbnail_url || LOGO;
        const viewsText = fmtViews(v.views);
        return `
          <a class="card" href="/watch.html?id=${encodeURIComponent(v.id)}" title="${esc(v.title)}">
            <div class="thumb">
              <img loading="lazy" src="${esc(thumb)}" alt="${esc(v.title)}" />
              <div class="badgeHD">HD</div>
              <div class="badgeViews">${viewsText} views</div>
            </div>
            <div class="meta">
              <div class="title">${esc(v.title || "Untitled")}</div>
              <div class="sub">
                ${v.genre ? `<span>${esc(v.genre)}</span>` : ``}
              </div>
            </div>
          </a>
        `;
      }).join("");

      for (let i=0;i<stripCount;i++){
        const t = $(`wstrip_${i}`);
        const p = $(`wprev_${i}`);
        const n = $(`wnext_${i}`);
        if (t && p && n){
          p.onclick = () => scrollByCard(t, -1);
          n.onclick = () => scrollByCard(t, 1);
        }
      }
    }

    // ---------- Pagination ----------
    function setPage(p){
      currentPage = p;
      renderList();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function paginate(totalPages){
      const pager = $("pager");
      pager.innerHTML = "";
      if (totalPages <= 1) return;

      const btn = (label, p, cls="") => {
        const b = document.createElement("button");
        b.className = `pbtn ${cls}`.trim();
        b.textContent = label;
        if (p) b.onclick = () => setPage(p);
        return b;
      };

      const page = currentPage;
      const pages = [];

      pages.push(1);
      const start = Math.max(2, page - 2);
      const end = Math.min(totalPages - 1, page + 2);

      if (start > 2) pages.push("...");
      for (let i=start;i<=end;i++) pages.push(i);
      if (end < totalPages - 1) pages.push("...");
      if (totalPages > 1) pages.push(totalPages);

      const compact = [];
      for (const x of pages){
        if (compact.length && compact[compact.length-1] === x) continue;
        compact.push(x);
      }

      compact.forEach(x => {
        if (x === "...") pager.appendChild(btn("…", null, "dot"));
        else pager.appendChild(btn(String(x), x, (x===page ? "on" : "")));
      });
    }

    // ---------- Filters (search + genre) ----------
    function applyFilters(){
      const q = $("q").value.trim().toLowerCase();
      const byGenre = currentGenre.trim().toLowerCase();

      filtered = all.filter(v => {
        const title = String(v.title || "").toLowerCase();
        const genre = String(v.genre || "").toLowerCase();

        const matchQ = !q || title.includes(q) || genre.includes(q);
        const matchG = !byGenre || genre.split(",").map(x=>x.trim()).includes(byGenre);
        return matchQ && matchG;
      });

      currentPage = 1;
      renderList();

      $("searchHint").textContent = q ? `${filtered.length} hasil` : "";
      $("listTitle").textContent = byGenre ? `Genre: ${currentGenre}` : "All Videos";
    }

    // ---------- Render list ----------
    function renderList(){
      // poster (tiktok) TIDAK masuk All Videos
      const posters = filtered.filter(v => v.poster_wide_url);
      const normal  = filtered.filter(v => !v.poster_wide_url);

      // Popular: TOP views dari normal
      const popular = [...normal]
        .sort((a,b) => (Number(b.views||0) - Number(a.views||0)))
        .slice(0, 20);

      if (popular.length && Number(popular[0]?.views || 0) > 0){
        $("popularSection").classList.remove("hide");
        renderCarousel($("popularTrack"), popular, "popular");
      } else {
        $("popularSection").classList.add("hide");
      }

      // Poster section: ada tombol See All
      if (posters.length){
        $("wideSection").classList.remove("hide");
        // kalau See All ON -> tampilkan semua poster, kalau OFF -> tampilkan 20 pertama
        renderCarousel($("wideTrack"), showAllPoster ? posters : posters.slice(0, 20), "wide");
        const btn = $("seeAllPoster");
        if (btn) btn.textContent = showAllPoster ? "Show Less" : "See All";
      } else {
        $("wideSection").classList.add("hide");
      }

      const totalPages = Math.max(1, Math.ceil(normal.length / PAGE_SIZE));
      const page = Math.min(currentPage, totalPages);
      currentPage = page;

      const start = (page - 1) * PAGE_SIZE;
      const pageItems = normal.slice(start, start + PAGE_SIZE);

      const chunks = buildGridItems(pageItems, posters);
      renderGrid(chunks);

      paginate(totalPages);
    }

    // ---------- Drawer genre list ----------
    function renderGenres(){
      const set = new Set();
      all.forEach(v => {
        const g = String(v.genre || "").split(",").map(x=>x.trim()).filter(Boolean);
        g.forEach(x => set.add(x));
      });
      const genres = Array.from(set).sort((a,b)=>a.localeCompare(b));

      const wrap = $("navGenres");
      wrap.innerHTML = genres.map(g => `<div class="navItem" data-genre="${esc(g)}">${esc(g)}</div>`).join("");

      wrap.querySelectorAll("[data-genre]").forEach(el => {
        el.addEventListener("click", () => {
          currentGenre = el.getAttribute("data-genre") || "";
          openDrawer(false);
          applyFilters();
        });
      });

      $("navStatic").querySelectorAll("[data-nav]").forEach(el=>{
        el.addEventListener("click", ()=>{
          openDrawer(false);
          currentGenre = "";
          applyFilters();
        });
      });
    }

    // ---------- Init ----------
    async function init(){
      $("btnSearch").addEventListener("click", ()=>toggleSearch());
      $("btnMenu").addEventListener("click", ()=>openDrawer(true));
      $("btnClose").addEventListener("click", ()=>openDrawer(false));
      $("drawerMask").addEventListener("click", ()=>openDrawer(false));

      $("popularPrev").onclick = ()=>scrollByCard($("popularTrack"), -1);
      $("popularNext").onclick = ()=>scrollByCard($("popularTrack"), 1);
      $("widePrev").onclick = ()=>scrollByCard($("wideTrack"), -1);
      $("wideNext").onclick = ()=>scrollByCard($("wideTrack"), 1);

      // See All poster toggle
      const seeAllBtn = $("seeAllPoster");
      if (seeAllBtn){
        seeAllBtn.onclick = () => {
          showAllPoster = !showAllPoster;
          renderList();
        };
      }

      $("q").addEventListener("input", debounce(applyFilters, 120));

      try{
        all = await loadVideos();

        // FIX: kalau baru masuk dan cuma kebaca dikit (misal 3),
        // retry 1x setelah jeda kecil (edge/cold start/cache aneh)
        if (Array.isArray(all) && all.length > 0 && all.length <= 3) {
          await new Promise(r => setTimeout(r, 450));
          const again = await loadVideos();
          if (Array.isArray(again) && again.length > all.length) all = again;
        }

        filtered = all.slice();
        renderGenres();
        renderList();
      }catch(e){
        $("grid").innerHTML = `<div class="card" style="padding:14px">Error: ${esc(e.message || e)}</div>`;
        $("pager").innerHTML = "";
      }
    }

    init();
  </script>
</body>
</html>
