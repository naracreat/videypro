<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>videypro - Genre</title>

<link rel="icon" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh6s1lM6IpO7DtDtvK_FrWPhd40Bl858JxP5qFVvh2TPNyCNuShcMQWOsuV0WHv7S14C2WYPumF6WZOgc2D59hRAdnMIeGuSKKxZtlyujnakGnVLREf9Lwm8G2I0IYKXUY4aYtJ88qWJVXDw-ffYtvoPjtQxqYmEZqY0VL9IafS0a7mw6jke6wE/s1154/104427.png"/>

<style>
:root{
--bg:#0a0a0a;
--card:#111;
--line:#1f1f1f;
--muted:#9ca3af;
--text:#fff;
--r:16px;
--max:1080px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}

/* HEADER */
.header{position:sticky;top:0;background:#0a0a0ae6;border-bottom:1px solid var(--line);z-index:50}
.bar{max-width:var(--max);margin:auto;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.left{display:flex;align-items:center;gap:10px}
.logo{width:28px;height:28px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.logo img{width:100%;height:100%;object-fit:cover}
.brand{font-weight:900}
.iconbtn{width:38px;height:38px;border-radius:12px;background:#0d0d0d;border:1px solid var(--line);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px;stroke:#fff;stroke-width:2;fill:none}

/* LAYOUT */
.wrap{max-width:var(--max);margin:auto;padding:14px 12px}
.topRow{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pageTitle{font-size:18px;font-weight:900}
.backBtn{border:1px solid var(--line);background:#0d0d0d;border-radius:12px;padding:8px 12px;font-weight:900;cursor:pointer}

/* CONTROLS */
.controls{display:flex;gap:10px;margin-bottom:12px}
.select,.btn{border:1px solid var(--line);background:#0d0d0d;border-radius:12px;padding:8px 12px;color:#fff;font-weight:900}

/* BLOCK */
.block{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:12px}
.blockHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.muted{color:var(--muted);font-size:12px}

/* 🔥 POSTER GRID FIX 19:6 */
.posterGrid{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:10px;
align-items:start;
}

.posterCard{
background:#0b0b0b;
border:1px solid rgba(255,255,255,.08);
border-radius:14px;
overflow:hidden;
display:flex;
flex-direction:column;
}

.posterThumb{
width:100%;
aspect-ratio:19/6;
background:#000;
position:relative;
overflow:hidden;
flex:0 0 auto;
}

.posterThumb img{
width:100%;
height:100%;
object-fit:cover;
object-position:center;
}

.posterMeta{padding:10px}
.posterTitle{font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.posterSub{font-size:12px;color:var(--muted)}

/* 16:9 GRID */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.thumb169{aspect-ratio:16/9;background:#000;position:relative}
.thumb169 img{width:100%;height:100%;object-fit:cover}
.meta{padding:10px}
.title{font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted)}

.badgeHD,.badgeViews{position:absolute;background:rgba(0,0,0,.65);border-radius:999px;padding:4px 8px;font-size:12px}
.badgeHD{top:8px;left:8px}
.badgeViews{bottom:8px;right:8px}

.footer{border-top:1px solid var(--line);margin-top:14px;padding:14px;text-align:center;color:var(--muted);font-size:12px}
.hide{display:none!important}
</style>
</head>

<body>

<header class="header">
<div class="bar">
<a class="left" href="/">
<div class="logo"><img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh6s1lM6IpO7DtDtvK_FrWPhd40Bl858JxP5qFVvh2TPNyCNuShcMQWOsuV0WHv7S14C2WYPumF6WZOgc2D59hRAdnMIeGuSKKxZtlyujnakGnVLREf9Lwm8G2I0IYKXUY4aYtJ88qWJVXDw-ffYtvoPjtQxqYmEZqY0VL9IafS0a7mw6jke6wE/s1154/104427.png"></div>
<div class="brand">videypro</div>
</a>
</div>
</header>

<main class="wrap">

<div class="topRow">
<div class="pageTitle" id="genreTitle">Genre</div>
<button class="backBtn" onclick="history.back()">Back</button>
</div>

<div class="controls">
<select id="sortSel" class="select">
<option value="popular">Sort: Populer</option>
<option value="newest">Sort: Terbaru</option>
</select>
<button class="btn" onclick="location.reload()">Reset</button>
</div>

<section class="block hide" id="posterBlock">
<div class="blockHead">
<div>
<h2>Poster (19:6)</h2>
<div class="muted" id="posterCount"></div>
</div>
<button class="btn hide" id="btnPosterAll">Show All</button>
</div>
<div class="posterGrid" id="posterGrid"></div>
</section>

<section class="block" id="videoBlock">
<div class="blockHead">
<div>
<h2>All Videos</h2>
<div class="muted" id="videoCount"></div>
</div>
</div>
<div class="grid" id="grid"></div>
</section>

<footer class="footer">videypro</footer>

</main>

<script>
const $=id=>document.getElementById(id);
const LOGO="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh6s1lM6IpO7DtDtvK_FrWPhd40Bl858JxP5qFVvh2TPNyCNuShcMQWOsuV0WHv7S14C2WYPumF6WZOgc2D59hRAdnMIeGuSKKxZtlyujnakGnVLREf9Lwm8G2I0IYKXUY4aYtJ88qWJVXDw-ffYtvoPjtQxqYmEZqY0VL9IafS0a7mw6jke6wE/s1154/104427.png";

async function loadVideos(){
const r=await fetch("/api/videos?t="+Date.now(),{cache:"no-store"});
return await r.json();
}

function getGenre(){
return new URL(location.href).searchParams.get("g")||"";
}

async function init(){
const genre=getGenre();
$("genreTitle").textContent="Genre: "+genre;
const all=await loadVideos();
const inGenre=all.filter(v=>(v.genre||"").toLowerCase().includes(genre.toLowerCase()));

const posters=inGenre.filter(v=>v.poster_wide_url);
const videos=inGenre.filter(v=>!v.poster_wide_url);

if(posters.length){
$("posterBlock").classList.remove("hide");
$("posterCount").textContent=posters.length+" item";
$("posterGrid").innerHTML=posters.slice(0,6).map(v=>`
<a class="posterCard" href="/watch.html?id=${v.id}">
<div class="posterThumb">
<img src="${v.poster_wide_url||LOGO}">
<div class="badgeHD">HD</div>
<div class="badgeViews">${v.views||0} views</div>
</div>
<div class="posterMeta">
<div class="posterTitle">${v.title}</div>
<div class="posterSub">${v.genre}</div>
</div>
</a>`).join("");
}

$("videoCount").textContent=videos.length+" item";
$("grid").innerHTML=videos.map(v=>`
<a class="card" href="/watch.html?id=${v.id}">
<div class="thumb169">
<img src="${v.thumbnail_url||LOGO}">
<div class="badgeHD">HD</div>
<div class="badgeViews">${v.views||0} views</div>
</div>
<div class="meta">
<div class="title">${v.title}</div>
<div class="sub">${v.genre}</div>
</div>
</a>`).join("");
}

init();
</script>

</body>
</html>
