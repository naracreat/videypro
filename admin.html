<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin</title>
  <style>
    body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui,Segoe UI,Roboto}
    .wrap{max-width:1100px;margin:18px auto;padding:0 12px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    h1{margin:0;font-size:18px}
    .pill{font-size:12px;color:#cbd5e1;background:#0f172a;border:1px solid #1f2a44;padding:6px 10px;border-radius:999px}
    .grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
    .card{background:#111;border:1px solid #1f1f1f;border-radius:16px;padding:12px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media (max-width:860px){.row{grid-template-columns:1fr}}
    label{display:block;font-size:12px;color:#9ca3af;margin-bottom:6px}
    input,select,button{
      width:100%;box-sizing:border-box;
      padding:10px 12px;border-radius:12px;border:1px solid #2a2a2a;background:#0c0c0c;color:#fff;outline:none
    }
    input:focus,select:focus{border-color:#3b82f6}
    button{cursor:pointer;border:1px solid #2b3a57;background:#0b1220}
    button:hover{background:#0a1020}
    button.secondary{background:#0c0c0c;border-color:#2a2a2a}
    button.secondary:hover{background:#101010}
    .btns{display:flex;gap:10px;flex-wrap:wrap}
    .btns button{width:auto}
    .servers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media (max-width:860px){.servers{grid-template-columns:1fr}}
    .server{background:#0f0f0f;border:1px solid #1f1f1f;border-radius:14px;padding:10px}
    .serverTop{display:flex;align-items:center;justify-content:space-between}
    .st{font-weight:700;font-size:13px}
    .actions{display:flex;gap:8px}
    .actions button{padding:8px 10px;border-radius:10px;font-size:12px}
    .status{white-space:pre-wrap;color:#9ca3af;font-size:13px}
    .ok{color:#86efac}.bad{color:#fca5a5}
    .historyTop{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
    table{width:100%;border-collapse:separate;border-spacing:0 8px}
    td,th{font-size:13px;text-align:left}
    th{color:#9ca3af;font-weight:700}
    .tr{background:#0f0f0f;border:1px solid #1f1f1f}
    .rowcard{border:1px solid #1f1f1f;background:#0f0f0f;border-radius:14px;padding:10px}
    .twrap{display:grid;grid-template-columns:1.2fr .7fr .6fr;gap:10px;align-items:center}
    @media (max-width:860px){.twrap{grid-template-columns:1fr}}
    .small{font-size:12px;color:#9ca3af}
    .idpill{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid #2a2a2a;background:#0c0c0c;font-size:12px;color:#cbd5e1}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Admin</h1>
      <span class="pill">HISTORY • EDIT • DELETE • BACKUP</span>
    </div>

    <div class="grid">
      <!-- FORM -->
      <div class="card">
        <div class="row">
          <div>
            <label>Password</label>
            <input id="password" type="password" placeholder="••••••••" />
          </div>
          <div>
            <label>Mode</label>
            <select id="mode">
              <option value="create">Create</option>
              <option value="edit">Edit</option>
            </select>
          </div>
        </div>

        <div style="height:10px"></div>

        <div class="row">
          <div>
            <label>Title</label>
            <input id="title" placeholder="Judul" />
          </div>
          <div>
            <label>Genre</label>
            <input id="genre" placeholder="action, drama" />
          </div>
        </div>

        <div style="height:10px"></div>

        <div class="row">
          <div>
            <label>Thumbnail URL (16:9)</label>
            <input id="thumbnail_url" placeholder="https://.../thumb.jpg" />
          </div>
          <div>
            <label>Poster 19:6 URL (opsional)</label>
            <input id="poster_wide_url" placeholder="https://.../poster_wide.jpg" />
          </div>
        </div>

        <div style="height:10px"></div>

        <div class="row">
          <div>
            <label>Editing ID (auto isi kalau klik Edit)</label>
            <input id="edit_id" placeholder="ID" disabled />
          </div>
          <div></div>
        </div>

        <div style="height:12px"></div>

        <div class="servers" id="servers"></div>

        <div style="height:12px"></div>

        <div class="btns">
          <button id="btnSubmit" type="button">Save</button>
          <button id="btnReset" type="button" class="secondary">Reset</button>
          <button id="btnReload" type="button" class="secondary">Reload History</button>
        </div>

        <div id="status" class="status" style="margin-top:10px"></div>
      </div>

      <!-- HISTORY -->
      <div class="card">
        <div class="historyTop">
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
            <span class="pill">History</span>
            <input id="hsearch" placeholder="Search title/genre..." style="max-width:280px" />
          </div>
          <div class="btns">
            <button id="btnDownload" type="button" class="secondary">Download</button>
            <label style="margin:0">
              <input id="uploadFile" type="file" accept="application/json" style="display:none" />
              <button id="btnUpload" type="button" class="secondary">Upload</button>
            </label>
          </div>
        </div>

        <div id="history" style="margin-top:10px"></div>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const SERVER_COUNT = 4;
  let HISTORY = [];

  const esc = (s="") => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const debounce = (fn, ms=150) => { let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; };

  function detectType(url) {
    const u = (url||"").trim().toLowerCase();
    if (!u) return "";
    if (u.endsWith(".m3u8")) return "hls";
    if (u.endsWith(".mp4")) return "mp4";
    return "iframe";
  }

  function setStatus(msg, ok=true){
    const el = $("status");
    el.className = "status " + (ok ? "ok":"bad");
    el.textContent = msg || "";
  }

  function renderServers(){
    const wrap = $("servers");
    wrap.innerHTML = "";
    for (let i=1;i<=SERVER_COUNT;i++){
      const div = document.createElement("div");
      div.className = "server";
      div.innerHTML = `
        <div class="serverTop">
          <div class="st">Server ${i}</div>
          <div class="actions">
            <button type="button" class="secondary" data-auto="${i}">Auto</button>
            <button type="button" class="secondary" data-open="${i}">Open</button>
            <button type="button" class="secondary" data-clear="${i}">Clear</button>
          </div>
        </div>
        <div style="height:8px"></div>
        <div class="row">
          <div>
            <label>Type</label>
            <select id="server${i}_type">
              <option value=""></option>
              <option value="mp4">mp4</option>
              <option value="hls">hls</option>
              <option value="iframe">iframe</option>
            </select>
          </div>
          <div>
            <label>URL</label>
            <input id="server${i}_url" placeholder="https://..." />
          </div>
        </div>
      `;
      wrap.appendChild(div);

      const typeEl = div.querySelector(`#server${i}_type`);
      const urlEl  = div.querySelector(`#server${i}_url`);

      div.querySelector(`[data-auto="${i}"]`).onclick = () => {
        typeEl.value = detectType(urlEl.value);
      };
      div.querySelector(`[data-open="${i}"]`).onclick = () => {
        const u = urlEl.value.trim();
        if (!u) return;
        window.open(u, "_blank", "noopener,noreferrer");
      };
      div.querySelector(`[data-clear="${i}"]`).onclick = () => {
        typeEl.value = "";
        urlEl.value = "";
      };
    }
  }

  function buildPayload(){
    const payload = {
      password: $("password").value,
      id: $("edit_id").value ? Number($("edit_id").value) : undefined,
      title: $("title").value.trim(),
      genre: $("genre").value.trim(),
      thumbnail_url: $("thumbnail_url").value.trim(),
      poster_wide_url: $("poster_wide_url").value.trim(),
    };

    for (let i=1;i<=SERVER_COUNT;i++){
      payload[`server${i}_type`] = $(`server${i}_type`).value.trim();
      payload[`server${i}_url`]  = $(`server${i}_url`).value.trim();
    }

    if (!payload.genre) delete payload.genre;
    if (!payload.thumbnail_url) delete payload.thumbnail_url;
    if (!payload.poster_wide_url) delete payload.poster_wide_url;

    return payload;
  }

  function validate(payload){
    if (!payload.password) return "Password kosong";
    if (!payload.title) return "Title kosong";

    let hasServer = false;
    for (let i=1;i<=SERVER_COUNT;i++){
      const t = payload[`server${i}_type`];
      const u = payload[`server${i}_url`];
      if ((t && !u) || (!t && u)) return `Server ${i} type/url harus berpasangan`;
      if (t && u) hasServer = true;
    }
    if (!hasServer) return "Minimal isi 1 server";
    return null;
  }

  async function apiList(){
    const pass = encodeURIComponent($("password").value || "");
    const r = await fetch(`/api/admin/list?password=${pass}`, { cache:"no-store" });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }

  async function apiCreate(payload){
    const r = await fetch("/api/admin/add", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(payload)
    });
    if (!r.ok) throw new Error(await r.text());
  }

  async function apiUpdate(payload){
    const r = await fetch("/api/admin/update", {
      method:"PUT",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(payload)
    });
    if (!r.ok) throw new Error(await r.text());
  }

  async function apiDelete(id){
    const r = await fetch("/api/admin/delete", {
      method:"DELETE",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ password: $("password").value, id })
    });
    if (!r.ok) throw new Error(await r.text());
  }

  async function apiImport(items){
    const r = await fetch("/api/admin/import", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ password: $("password").value, items })
    });
    if (!r.ok) throw new Error(await r.text());
  }

  function resetForm(){
    $("mode").value = "create";
    $("edit_id").value = "";
    $("title").value = "";
    $("genre").value = "";
    $("thumbnail_url").value = "";
    $("poster_wide_url").value = "";
    for (let i=1;i<=SERVER_COUNT;i++){
      $(`server${i}_type`).value = "";
      $(`server${i}_url`).value = "";
    }
    setStatus("");
  }

  function fillForm(v){
    $("mode").value = "edit";
    $("edit_id").value = v.id;
    $("title").value = v.title || "";
    $("genre").value = v.genre || "";
    $("thumbnail_url").value = v.thumbnail_url || "";
    $("poster_wide_url").value = v.poster_wide_url || "";
    for (let i=1;i<=SERVER_COUNT;i++){
      $(`server${i}_type`).value = v[`server${i}_type`] || "";
      $(`server${i}_url`).value  = v[`server${i}_url`]  || "";
    }
    setStatus(`Editing ID ${v.id}`, true);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function renderHistory(list){
    const wrap = $("history");
    if (!list.length){
      wrap.innerHTML = `<div class="small">Empty</div>`;
      return;
    }

    wrap.innerHTML = list.map(v => `
      <div class="rowcard" data-id="${v.id}">
        <div class="twrap">
          <div>
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
              <span class="idpill">#${v.id}</span>
              <div style="font-weight:800">${esc(v.title||"")}</div>
            </div>
            <div class="small">${esc(v.genre||"")}${v.poster_wide_url ? " • 19:6" : ""}</div>
          </div>
          <div class="small">${esc(v.created_at||"")}</div>
          <div class="btns" style="justify-content:flex-end">
            <button class="secondary" data-edit="${v.id}">Edit</button>
            <button class="secondary" data-del="${v.id}">Delete</button>
          </div>
        </div>
      </div>
    `).join("");

    wrap.querySelectorAll("[data-edit]").forEach(btn=>{
      btn.onclick = () => {
        const id = Number(btn.getAttribute("data-edit"));
        const v = HISTORY.find(x => x.id === id);
        if (v) fillForm(v);
      };
    });

    wrap.querySelectorAll("[data-del]").forEach(btn=>{
      btn.onclick = async () => {
        const id = Number(btn.getAttribute("data-del"));
        if (!confirm(`Delete #${id}?`)) return;
        try{
          setStatus("Deleting...", true);
          await apiDelete(id);
          setStatus("Deleted ✅", true);
          await reloadHistory();
        }catch(e){
          setStatus(e.message || String(e), false);
        }
      };
    });
  }

  async function reloadHistory(){
    setStatus("Loading history...", true);
    HISTORY = await apiList();
    renderHistory(HISTORY);
    setStatus("", true);
  }

  const applyHistorySearch = debounce(() => {
    const q = $("hsearch").value.trim().toLowerCase();
    if (!q) return renderHistory(HISTORY);
    const f = HISTORY.filter(v =>
      String(v.title||"").toLowerCase().includes(q) ||
      String(v.genre||"").toLowerCase().includes(q)
    );
    renderHistory(f);
  }, 120);

  function downloadHistory(){
    const blob = new Blob([JSON.stringify(HISTORY, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `videypro_history_${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  async function uploadHistory(file){
    const text = await file.text();
    let data;
    try{ data = JSON.parse(text); }catch{ throw new Error("Invalid JSON"); }
    if (!Array.isArray(data)) throw new Error("JSON harus array");

    setStatus("Importing...", true);
    await apiImport(data);
    setStatus("Imported ✅", true);
    await reloadHistory();
  }

  async function submit(){
    try{
      const payload = buildPayload();
      const err = validate(payload);
      if (err) return setStatus(err, false);

      const mode = $("mode").value;
      setStatus("Saving...", true);

      if (mode === "edit") {
        if (!payload.id) return setStatus("Pilih item dari history dulu (Edit)", false);
        await apiUpdate(payload);
        setStatus("Updated ✅", true);
      } else {
        await apiCreate(payload);
        setStatus("Created ✅", true);
      }

      await reloadHistory();
    }catch(e){
      setStatus(e.message || String(e), false);
    }
  }

  // init
  renderServers();
  $("btnReset").onclick = resetForm;
  $("btnSubmit").onclick = submit;
  $("btnReload").onclick = () => reloadHistory().catch(e => setStatus(e.message||String(e), false));
  $("hsearch").addEventListener("input", applyHistorySearch);
  $("btnDownload").onclick = downloadHistory;

  $("btnUpload").onclick = () => $("uploadFile").click();
  $("uploadFile").addEventListener("change", async (e)=>{
    const f = e.target.files?.[0];
    if (!f) return;
    try{
      await uploadHistory(f);
    }catch(err){
      setStatus(err.message || String(err), false);
    } finally {
      e.target.value = "";
    }
  });

  // load history kalau password udah diisi (biar ga spam unauthorized)
  $("password").addEventListener("change", () => reloadHistory().catch(()=>{}));
</script>
</body>
</html>
