<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin</title>
  <style>
    body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui,Segoe UI,Roboto}
    .wrap{max-width:980px;margin:22px auto;padding:0 14px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    h1{margin:0;font-size:20px;letter-spacing:.2px}
    .pill{font-size:12px;color:#cbd5e1;background:#0f172a;border:1px solid #1f2a44;padding:6px 10px;border-radius:999px}
    .grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
    .card{background:#111;border:1px solid #1f1f1f;border-radius:16px;padding:14px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media (max-width:820px){.row{grid-template-columns:1fr}}
    label{display:block;font-size:12px;color:#9ca3af;margin-bottom:6px}
    input,select,button{
      width:100%;box-sizing:border-box;
      padding:10px 12px;border-radius:12px;border:1px solid #2a2a2a;
      background:#0c0c0c;color:#fff;
      outline:none;
    }
    input:focus,select:focus{border-color:#3b82f6}
    button{cursor:pointer;border:1px solid #2b3a57;background:#0b1220}
    button:hover{background:#0a1020}
    button.secondary{background:#0c0c0c;border-color:#2a2a2a}
    button.secondary:hover{background:#101010}
    .btns{display:flex;gap:10px;flex-wrap:wrap}
    .btns button{width:auto}
    .servers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width:820px){.servers{grid-template-columns:1fr}}
    .serverCard{background:#0f0f0f;border:1px solid #1f1f1f;border-radius:16px;padding:12px}
    .serverTop{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .serverTitle{font-weight:700;font-size:13px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .actions button{padding:8px 10px;border-radius:10px;font-size:12px}
    .thumbRow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .thumb{width:170px;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid #1f1f1f;background:#000}
    .thumb img{width:100%;height:100%;object-fit:cover;display:none}
    .status{white-space:pre-wrap;color:#9ca3af;font-size:13px}
    .ok{color:#86efac}
    .bad{color:#fca5a5}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Admin</h1>
      <span class="pill">POST VIDEO</span>
    </div>

    <div class="grid">
      <div class="card">
        <div class="row">
          <div>
            <label>Password</label>
            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
          </div>
          <div>
            <label>Genre</label>
            <input id="genre" placeholder="action, drama" />
          </div>
        </div>

        <div style="height:10px"></div>

        <div class="row">
          <div>
            <label>Title</label>
            <input id="title" placeholder="Judul video" />
          </div>
          <div>
            <label>Thumbnail URL</label>
            <input id="thumbnail_url" placeholder="https://.../thumb.jpg" />
          </div>
        </div>

        <div style="height:12px"></div>

        <div class="thumbRow">
          <div class="thumb">
            <img id="thumbImg" alt="thumb">
          </div>
          <div class="btns">
            <button type="button" class="secondary" id="btnPreviewThumb">Preview</button>
            <button type="button" class="secondary" id="btnDetectAll">Auto Type (All)</button>
            <button type="button" class="secondary" id="btnClearAll">Clear</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="servers" id="servers"></div>
      </div>

      <div class="card">
        <div class="btns">
          <button type="button" id="btnPublish">Publish</button>
          <button type="button" id="btnPublishReset" class="secondary">Publish + Reset</button>
        </div>
        <div id="status" class="status" style="margin-top:10px"></div>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const SERVER_COUNT = 4;

    function detectType(url) {
      const u = (url || "").trim().toLowerCase();
      if (!u) return "";
      if (u.endsWith(".m3u8")) return "hls";
      if (u.endsWith(".mp4")) return "mp4";
      return "iframe";
    }

    function setStatus(msg, ok=true) {
      const el = $("status");
      el.className = "status " + (ok ? "ok" : "bad");
      el.textContent = msg;
    }

    function previewThumb() {
      const url = $("thumbnail_url").value.trim();
      const img = $("thumbImg");
      if (!url) { img.style.display="none"; return setStatus("", true); }
      img.src = url;
      img.onload = () => { img.style.display="block"; setStatus("Thumbnail OK", true); };
      img.onerror = () => { img.style.display="none"; setStatus("Thumbnail ERROR", false); };
    }

    function clearAll() {
      $("title").value = "";
      $("genre").value = "";
      $("thumbnail_url").value = "";
      $("thumbImg").style.display = "none";
      for (let i=1;i<=SERVER_COUNT;i++){
        $(`server${i}_type`).value = "";
        $(`server${i}_url`).value = "";
      }
      setStatus("", true);
    }

    function detectAll() {
      for (let i=1;i<=SERVER_COUNT;i++){
        const url = $(`server${i}_url`).value.trim();
        if (!url) continue;
        $(`server${i}_type`).value = detectType(url);
      }
      setStatus("Auto type OK", true);
    }

    function renderServers() {
      const wrap = $("servers");
      wrap.innerHTML = "";
      for (let i=1;i<=SERVER_COUNT;i++){
        const div = document.createElement("div");
        div.className = "serverCard";
        div.innerHTML = `
          <div class="serverTop">
            <div class="serverTitle">Server ${i}</div>
            <div class="actions">
              <button type="button" class="secondary" data-detect="${i}">Auto</button>
              <button type="button" class="secondary" data-open="${i}">Open</button>
              <button type="button" class="secondary" data-clear="${i}">Clear</button>
            </div>
          </div>

          <div style="height:10px"></div>

          <div class="row">
            <div>
              <label>Type</label>
              <select id="server${i}_type">
                <option value=""></option>
                <option value="mp4">mp4</option>
                <option value="hls">hls</option>
                <option value="iframe">iframe</option>
              </select>
            </div>
            <div>
              <label>URL</label>
              <input id="server${i}_url" placeholder="https://..." />
            </div>
          </div>
        `;
        wrap.appendChild(div);

        const urlEl = div.querySelector(`#server${i}_url`);
        const typeEl = div.querySelector(`#server${i}_type`);

        div.querySelector(`[data-detect="${i}"]`).addEventListener("click", () => {
          typeEl.value = detectType(urlEl.value);
        });

        div.querySelector(`[data-open="${i}"]`).addEventListener("click", () => {
          const u = urlEl.value.trim();
          if (!u) return;
          window.open(u, "_blank", "noopener,noreferrer");
        });

        div.querySelector(`[data-clear="${i}"]`).addEventListener("click", () => {
          typeEl.value = "";
          urlEl.value = "";
        });
      }
    }

    function buildPayload() {
      const payload = {
        password: $("password").value,
        title: $("title").value.trim(),
        genre: $("genre").value.trim(),
        thumbnail_url: $("thumbnail_url").value.trim(),
      };

      for (let i=1;i<=SERVER_COUNT;i++){
        payload[`server${i}_type`] = $(`server${i}_type`).value.trim();
        payload[`server${i}_url`]  = $(`server${i}_url`).value.trim();
      }

      if (!payload.genre) delete payload.genre;
      if (!payload.thumbnail_url) delete payload.thumbnail_url;

      return payload;
    }

    function validate(payload) {
      if (!payload.password) return "Password kosong";
      if (!payload.title) return "Title kosong";

      let hasServer = false;
      for (let i=1;i<=SERVER_COUNT;i++){
        const t = payload[`server${i}_type`];
        const u = payload[`server${i}_url`];
        if ((t && !u) || (!t && u)) return `Server ${i} type/url harus berpasangan`;
        if (t && u) hasServer = true;
      }
      if (!hasServer) return "Minimal isi 1 server";
      return null;
    }

    async function publish(resetAfter) {
      setStatus("Publishing...", true);
      const payload = buildPayload();
      const err = validate(payload);
      if (err) return setStatus(err, false);

      const r = await fetch("/api/admin/add", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      });

      if (!r.ok) {
        const txt = await r.text();
        return setStatus(txt || "Gagal", false);
      }

      setStatus("Published ✅", true);
      if (resetAfter) clearAll();
    }

    renderServers();

    $("btnPreviewThumb").addEventListener("click", previewThumb);
    $("btnDetectAll").addEventListener("click", detectAll);
    $("btnClearAll").addEventListener("click", clearAll);
    $("btnPublish").addEventListener("click", () => publish(false));
    $("btnPublishReset").addEventListener("click", () => publish(true));

    $("thumbnail_url").addEventListener("input", () => {
      clearTimeout(window.__t);
      window.__t = setTimeout(previewThumb, 450);
    });
  </script>
</body>
</html>
